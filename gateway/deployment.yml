apiVersion: apps/v1
kind: Deployment
metadata:
  name: msa-sample-gateway
  labels:
    app: msa-sample
spec:
  replicas: 1
  selector:
    matchLabels:
      app: msa-sample
      tier: backend
  template:
    metadata:
      labels:
        app: msa-sample
        tier: backend
    spec:
      containers:
        - name: msa-sample
          image: soyoung1122/msa-sample-gateway:latest
          imagePullPolicy: Always
          resources:
            requests:
              memory: "256Mi"
              cpu: "50m"
            limits:
              memory: "1Gi"
              cpu: "500m"
          ports:
            - containerPort: 8083
          envFrom:
            - configMapRef:
                name: kpaas-msa-configmap
