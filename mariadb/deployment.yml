apiVersion: apps/v1
kind: Deployment
metadata:
  name: ${DEPLOYMENT_NAME}
spec:
  selector:
    matchLabels:
      app: ${APP_NAME}
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: ${APP_NAME}
    spec:
      containers:
      - image: docker.io/library/mariadb:11.4
        name: mariadb
        ports:
        - containerPort: 3306
          name: mariadb
        volumeMounts:
        - name: mariadb-persistent-storage
          mountPath: /docker-entrypoint-initdb.d
        - mountPath: /var/lib/mysql
          subPath: "mysql"
          name: mariadb-data
        env:
        - name: MYSQL_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: mariadb-secret
              key: DB_PASSWORD
        - name: MYSQL_DATABASE
          value: "openlab"
        - name: MYSQL_USER
          value: "admin"
        - name: MYSQL_PASSWORD
          valueFrom:
            secretKeyRef:
              name: mariadb-secret
              key: DB_PASSWORD
      volumes:
      - name: mariadb-persistent-storage
        configMap:
          name: mariadb-initdb-config
      - name: mariadb-data
        persistentVolumeClaim:
          claimName: mariadb-pv-claim
